<!doctype html>
<html lang="en-US" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#180713" />
    <title>Praise God Productions · Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        place-items: center;
        color: #fffdf7;
        background: radial-gradient(circle at 50% 20%, #713a33 0, #391126 35%, #180713 78%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(100%, 430px); text-align: center; }
      .mark { display: grid; width: 72px; height: 72px; margin: 0 auto 18px; place-items: center; color: #2a1035; background: #f4c542; border-radius: 50%; font-size: 1.2rem; font-weight: 950; }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 10vw, 3.2rem); line-height: .98; }
      p { margin: 0 auto 20px; color: #ddd0d9; line-height: 1.55; }
      a { display: inline-grid; min-height: 44px; padding: 0 18px; place-items: center; color: #2a1035; text-decoration: none; background: #f4c542; border-radius: 13px; font-weight: 900; }
      a:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">PG</div>
      <h1>You’re offline.</h1>
      <p>The Praise God Productions app shell and saved content remain available. Reconnect to refresh events, media, and updates.</p>
      <a href="/#home">Return home</a>
    </main>
  </body>
</html>
